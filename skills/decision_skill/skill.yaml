name: 校园决策技能（今天吃啥大转盘）
description: >-
  面向上海杉达学院学生的“选择困难”场景，通过自然语言理解 + 决策大转盘，
  帮学生在“在哪吃 / 口味 / 具体菜品”三层决策中收敛出确定选择，并在确定前弹出
  “美食名片”勾起食欲。支持对不想要选项的拒绝剔除与概率均分重转。
triggers:
  - 不知道今天吃啥
  - 帮我选吃什么
  - 随便 / 挑花眼了
  - 想吃点辣的 / 不辣的
tools:
  - build_wheel        # 生成某一层决策大转盘（真实选项来自数据）
  - finalize_decision  # 把最终决定写成产出物（Markdown）
  - share_with_roommate # 把决定发给室友（危险操作，需确认）
entry_point: decision_skill:activate
compliance:
  - 危险操作（对外发送）必须经用户确认
  - 数据源为示例，已显式标注；替换为真实校园数据即可作为真实数据源
  - 涉及供应提醒“以实际供应为准”，并提示防范诈骗
