name: 校园决策技能（选择助手·记忆+定位+转盘）
description: >-
  面向上海杉达学院学生的“选择困难”场景的智能体技能。核心价值是“帮大学生做选择”：
  (1) 决策大转盘：在哪吃 / 口味 / 菜品 三层收敛 + 美食名片；(2) 用户记忆画像：记住校区(定位圆心)/
  金额上限/口味/忌口，跨轮套用；(3) 就近综合推荐：以校区为圆心，按 距离+性价比+评分 加权排序；
  (4) 选择历史：每次完成选择留痕，最近10次聚合为“近期画像”。
triggers:
  - 不知道今天吃啥 / 帮我选吃什么
  - 随便 / 挑花眼了
  - 我在金海校区，预算20，附近吃啥
  - 推荐个性价比高的 / 就近的 / 好评多的
  - 不吃辣 / 忌辣 / 定位金海校区
tools:
  - build_wheel           # 生成某一层决策大转盘（真实选项来自数据，支持金额上限过滤）
  - finalize_decision     # 把最终决定写成产出物（Markdown），并写入选择历史
  - recommend_nearby_food # 以校区为圆心，距离+性价比+评分 综合推荐就近美食
  - finalize_recommend    # 把就近决定写成产出物，并写入选择历史
  - share_with_roommate   # 把决定发给室友（危险操作，需确认）
  - get_profile / set_profile   # 读取 / 更新用户记忆画像
  - get_recent_profile    # 聚合最近10次选择为“近期画像”
data_sources:
  - data/food_data.json   # 菜品（示例，可替换真实）
  - data/shops.json       # 周边商铺（示例，坐标为相对校区的真实散布）
  - data/campus.json      # 校区中心真实经纬度（圆心）
  - data/profile.json     # 用户记忆画像（本地，不进仓库）
  - data/history.json     # 选择历史（本地，不进仓库）
entry_point: decision_skill:activate
compliance:
  - 危险操作（对外发送）必须经用户确认
  - 数据源为示例，已显式标注；替换为真实校园数据即可作为真实数据源
  - 涉及供应/商户提醒“以实际为准”，并提示防范诈骗
